<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magpie</title>
<meta name="description" content="Magpie — a private, local-first memory assistant for your Mac.">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="apple-touch-icon" href="icon.svg?v=2">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<div id="app" class="app">

  <aside class="sidebar" aria-label="Primary">
    <div class="brand">
      <img class="brand-mark" src="icon.svg" alt="" width="26" height="26">
      <span class="brand-name">Magpie</span>
    </div>
    <nav class="nav" id="sideNav">
      <a class="nav-item" href="#/ask" data-route="ask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.35-4.13-.98L3 20l.98-5.37A8.5 8.5 0 1 1 21 11.5z"/></svg>
        <span>Ask</span>
      </a>
      <a class="nav-item" href="#/search" data-route="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
        <span>Search</span>
      </a>
      <a class="nav-item" href="#/timeline" data-route="timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Timeline</span>
      </a>
      <a class="nav-item" href="#/journal" data-route="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2.5H20v19H6.5A2.5 2.5 0 0 1 4 19z"/><path d="M4 19V5a2.5 2.5 0 0 1 2.5-2.5"/><path d="M8.5 7.5h7M8.5 11h7"/></svg>
        <span>Journal</span>
      </a>
      <a class="nav-item" href="#/loops" data-route="loops">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5V8h-4.5"/></svg>
        <span>Loops</span>
      </a>
      <a class="nav-item" href="#/meetings" data-route="meetings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"/></svg>
        <span>Meetings</span>
      </a>
      <a class="nav-item" href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17.5 7H20M4 17h3.5M12 17h8"/><circle cx="15" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <span class="kbd-hint"><kbd>⌘K</kbd> Ask · <kbd>/</kbd> Search</span>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="header">
      <div class="header-left">
        <img class="brand-mark header-brand" src="icon.svg" alt="" width="24" height="24">
        <h1 class="view-title" id="viewTitle">Ask</h1>
      </div>
      <div class="header-right">
        <div class="status-pill" id="statusPill" role="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting…</span>
        </div>
        <button class="btn btn-ghost" id="pauseBtn" type="button" hidden>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5v13M15 5.5v13"/></svg>
          <span id="pauseLabel">Pause</span>
        </button>
      </div>
    </header>

    <div class="meeting-banner" id="meetingBanner" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg>
      <span>It looks like you’re in a meeting.</span>
      <button class="btn btn-small btn-accent" id="bannerRecordBtn" type="button">Record this meeting</button>
      <button class="btn btn-small btn-ghost" id="bannerDismissBtn" type="button" aria-label="Dismiss">Dismiss</button>
    </div>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <a class="tab-item" href="#/ask" data-route="ask">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.35-4.13-.98L3 20l.98-5.37A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <span>Ask</span>
    </a>
    <a class="tab-item" href="#/search" data-route="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
      <span>Search</span>
    </a>
    <a class="tab-item" href="#/timeline" data-route="timeline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Timeline</span>
    </a>
    <a class="tab-item" href="#/loops" data-route="loops">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5V8h-4.5"/></svg>
      <span>Loops</span>
    </a>
    <a class="tab-item" href="#/meetings" data-route="meetings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg>
      <span>Meetings</span>
    </a>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="app.js?v=4"></script>
</body>
</html>
